<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Free Fire Redeem Code</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#070707;
    color:#fff;
    min-height:100vh;
}

.container{
    width:100%;
    max-width:520px;
    margin:auto;
    padding:15px;
}

/* TOP IMAGE */
.icon{
    width:100%;
    display:flex;
    justify-content:center;
    margin-bottom:14px;
}

.icon img{
    width:100%;
    max-width:500px;
    border-radius:12px;
    display:block;
}

/* VIDEO */
.video{
    position:relative;
    width:100%;
    background:#000;
    border-radius:12px;
    overflow:hidden;
    margin-bottom:15px;
    border:1px solid #222;
}

.video video{
    width:100%;
    display:block;
    max-height:500px;
    background:#000;
}

.video-label{
    position:absolute;
    top:10px;
    left:10px;
    background:rgba(0,0,0,.75);
    padding:6px 10px;
    border-radius:6px;
    font-size:12px;
    font-weight:bold;
}

/* TITLE */
.title{
    text-align:center;
    font-size:26px;
    font-weight:800;
    margin:10px 0;
    color:#ffb300;
}

.subtitle{
    text-align:center;
    color:#aaa;
    font-size:14px;
    margin-bottom:18px;
}

/* WATCHING */
.watching{
    text-align:center;
    background:#111;
    border:1px solid #292929;
    padding:10px;
    border-radius:8px;
    margin-bottom:15px;
    color:#ddd;
    font-size:14px;
}

.watching span{
    color:#00ff66;
    font-weight:bold;
}

/* REDEEM BUTTON */
.redeem-btn{
    width:100%;
    border:none;
    outline:none;
    padding:16px;
    border-radius:10px;
    background:linear-gradient(135deg,#ff9800,#ff3d00);
    color:#fff;
    font-size:18px;
    font-weight:800;
    cursor:pointer;
    box-shadow:0 5px 20px rgba(255,100,0,.25);
    transition:.2s;
}

.redeem-btn:hover{
    transform:translateY(-2px);
}

.redeem-btn:active{
    transform:scale(.98);
}

/* CLAIMED */
.claimed{
    text-align:center;
    margin:16px 0;
    font-size:12px;
    color:#aaa;
}

/* FEATURES */
.features{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    margin-bottom:16px;
}

.feature{
    background:#111;
    border:1px solid #292929;
    border-radius:8px;
    padding:12px 5px;
    text-align:center;
    font-size:11px;
    color:#ccc;
}

.feature b{
    display:block;
    color:#00ff66;
    margin-bottom:4px;
    font-size:13px;
}

/* COMMENTS */
.comments-box{
    background:#0f0f0f;
    border:1px solid #292929;
    border-radius:10px;
    padding:12px;
    margin-bottom:15px;
}

.comments-title{
    font-size:15px;
    font-weight:bold;
    margin-bottom:10px;
}

.comment{
    padding:9px 0;
    border-bottom:1px solid #202020;
    font-size:13px;
}

.comment:last-child{
    border-bottom:none;
}

.comment-name{
    color:#ffb300;
    font-weight:bold;
    margin-bottom:3px;
}

.comment-text{
    color:#ccc;
}

/* SHARE */
.share-btn{
    width:100%;
    padding:13px;
    border-radius:8px;
    border:1px solid #333;
    background:#151515;
    color:#fff;
    font-weight:bold;
    cursor:pointer;
}

.share-btn:hover{
    background:#1d1d1d;
}

/* TOAST */
.toast{
    position:fixed;
    left:50%;
    bottom:25px;
    transform:translateX(-50%) translateY(100px);
    background:#222;
    color:#fff;
    padding:12px 18px;
    border-radius:8px;
    font-size:13px;
    opacity:0;
    pointer-events:none;
    transition:.3s;
    z-index:9999;
    box-shadow:0 5px 25px rgba(0,0,0,.4);
}

.toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}

/* FOOTER */
.footer{
    text-align:center;
    color:#666;
    font-size:11px;
    padding:15px 0 5px;
}

@media(max-width:380px){
    .title{
        font-size:22px;
    }

    .features{
        gap:5px;
    }
}
</style>
</head>

<body>

<div class="container">

    <!-- TOP IMAGE -->
    <div class="icon">
        <img
            src="https://i.postimg.cc/rmjsPs7J/B597430F-241F-4AB2-BCEF-48A2B2B4E44F.png"
            alt="Free Fire Redeem Code">
    </div>

    <!-- VIDEO -->
    <div class="video">

        <video
            id="ffVideo"
            controls
            playsinline
            preload="metadata">

            <source
                src="https://www.image2url.com/r2/default/videos/1790337213058-fccf30c7-c78a-49ae-8fdb-a82d37b6476d.mp4"
                type="video/mp4">

            Your browser does not support HTML5 video.
        </video>

        <div class="video-label">
            FF • VDO • 2026
        </div>

    </div>

    <!-- TITLE -->
    <div class="title">
        FREE FIRE REDEEM CODE
    </div>

    <div class="subtitle">
        Complete the process below to claim your reward
    </div>

    <!-- WATCHING -->
    <div class="watching">
        🔴 <span id="watchingCount">1,247</span> players are watching now
    </div>

    <!-- REDEEM BUTTON -->
    <button class="redeem-btn" onclick="claimCode()">
        🎁 GET REDEEM CODE
    </button>

    <!-- CLAIMED -->
    <div class="claimed">
        🔥 97,486 REDEEM CODES CLAIMED IN LAST HOUR
    </div>

    <!-- FEATURES -->
    <div class="features">

        <div class="feature">
            <b>✓ VIRUS FREE</b>
            100% Safe
        </div>

        <div class="feature">
            <b>⚡ FAST</b>
            Instant Access
        </div>

        <div class="feature">
            <b>👥 78K+</b>
            Happy Users
        </div>

    </div>

    <!-- COMMENTS -->
    <div class="comments-box">

        <div class="comments-title">
            💬 Live Comments
        </div>

        <div id="comments"></div>

    </div>

    <!-- SHARE -->
    <button class="share-btn" onclick="sharePage()">
        📤 SHARE THIS PAGE
    </button>

    <div class="footer">
        © 2026 Free Fire Redeem • All Rights Reserved
    </div>

</div>

<!-- TOAST -->
<div class="toast" id="toast">
    Done!
</div>


<script>

/* =========================================
   OFFER LINK
========================================= */

const offerLink =
"https://glmd.site/click/6aa3943472b8dd685377f27a/6aa385d172b8dd685377e050";


/* =========================================
   REDEEM BUTTON
========================================= */

function claimCode(){

    window.open(
        offerLink,
        "_blank",
        "noopener,noreferrer"
    );

}


/* =========================================
   TOAST
========================================= */

function showToast(message){

    const toast = document.getElementById("toast");

    toast.textContent = message;

    toast.classList.add("show");

    setTimeout(function(){

        toast.classList.remove("show");

    },2500);

}


/* =========================================
   WATCHING COUNT
========================================= */

function updateWatching(){

    const count =
        Math.floor(Math.random() * 200) + 1200;

    document.getElementById("watchingCount")
        .textContent = count.toLocaleString();

}

setInterval(updateWatching,3000);


/* =========================================
   LIVE COMMENTS
========================================= */

const comments = [

    {
        name:"Rahul",
        text:"Code mil gaya 🔥"
    },

    {
        name:"Aman",
        text:"Working bro ❤️"
    },

    {
        name:"FF Player",
        text:"Thanks for the redeem code!"
    },

    {
        name:"Rohit",
        text:"Just claimed it 😍"
    },

    {
        name:"Gaming King",
        text:"Nice website 🔥"
    },

    {
        name:"Sahil",
        text:"Reward received!"
    },

    {
        name:"Ajay",
        text:"Finally got my code!"
    },

    {
        name:"Pro Gamer",
        text:"It worked for me 👍"
    }

];

let commentIndex = 0;


function addComment(){

    const container =
        document.getElementById("comments");

    const data =
        comments[commentIndex];

    const div =
        document.createElement("div");

    div.className = "comment";

    div.innerHTML = `
        <div class="comment-name">
            ${data.name}
        </div>

        <div class="comment-text">
            ${data.text}
        </div>
    `;

    container.prepend(div);

    if(container.children.length > 4){

        container.removeChild(
            container.lastElementChild
        );

    }

    commentIndex++;

    if(commentIndex >= comments.length){

        commentIndex = 0;

    }

}


/* Initial comments */

addComment();
addComment();
addComment();


/* New comment every 2.5 seconds */

setInterval(addComment,2500);


/* =========================================
   SHARE
========================================= */

async function sharePage(){

    const shareData = {

        title:"Free Fire Redeem Code",

        text:"Check this Free Fire redeem code page!",

        url:window.location.href

    };


    if(navigator.share){

        try{

            await navigator.share(shareData);

        }catch(error){

            /* User cancelled share */

        }

    }else{

        try{

            await navigator.clipboard.writeText(
                window.location.href
            );

            showToast("Page link copied!");

        }catch(error){

            showToast("Copy failed.");

        }

    }

}

</script>

</body>
</html>
